<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 ABOUT · TiDE Lab</title>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261029b">
<link rel="stylesheet" href="assets/css/base.css?v=20261029b">
<style>
  .about-mission h1 { font-size: clamp(28px, 4vw, 48px); font-weight: 900; line-height: 1.2; }
  .about-mission .en { font-size: clamp(13px, 1.6vw, 20px); color: var(--gray); letter-spacing: .18em; font-weight: 300; }
  .about-aff { margin-top: var(--sp-2); font-size: var(--fs-small); color: var(--ink-2); }
  .intro-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .intro-cols p { margin-bottom: var(--sp-2); font-size: var(--fs-small); }
  .intro-cols .col-en p { color: var(--gray); }
  .about-figure img { width: 100%; border: 1px solid var(--line); }
  .about-figure figcaption { font-size: var(--fs-tiny); color: var(--gray); margin-top: 8px; }
  .dir-card .thumb { aspect-ratio: 4/3; overflow: hidden; background: var(--bg-soft); position: relative; }
  .dir-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 1080px) {
    .intro-cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-page="about">
<div id="tide-nav"></div>

<main class="wrap">
  <div id="page-head"></div>

  <!-- ===== 使命 ===== -->
  <div class="about-mission" style="margin-top:var(--sp-4)">
    <h1 id="mission-zh"></h1>
    <div class="en" id="mission-en"></div>
    <div class="about-aff" id="affiliation"></div>
  </div>

  <!-- ===== 实验室介绍（中英对照） ===== -->
  <div id="sec-intro-head"></div>
  <div class="intro-cols" id="intro-cols"></div>
  <figure class="about-figure" id="intro-figure"></figure>

  <!-- ===== 理念 ===== -->
  <div id="sec-philosophy-head"></div>
  <div id="philosophy-block"></div>

  <!-- ===== 四大方向速览 ===== -->
  <div id="sec-directions-head"></div>
  <div class="grid c4" id="directions-grid"></div>

  <!-- ===== 联系方式 ===== -->
  <div id="sec-contact-head"></div>
  <div id="contact-block"></div>
</main>

<div id="tide-footer"></div>

<script src="data/site.js?v=20261029b"></script>
<script src="data/research.js?v=20261029b"></script>
<script src="data/projects.js?v=20261029b"></script>
<script src="data/members.js?v=20261029b"></script>
<script src="data/outputs.js?v=20261029b"></script>
<script src="assets/js/ui.js?v=20261029b"></script>
<script>
(function () {
  var U = TIDE_UI, S = TIDE_SITE;

  /* 页面头 */
  document.getElementById("page-head").innerHTML =
    U.secHead("关于", "ABOUT", "More Adaptive<br/>More Livable<br/>Together", "purple");

  /* 使命与隶属 */
  document.getElementById("mission-zh").textContent = S.missionZh;
  document.getElementById("mission-en").textContent = S.missionEn;
  document.getElementById("affiliation").textContent =
    S.labNameZh + " · " + S.labNameEn + " ｜ 隶属：" + S.affiliationZh;

  /* 实验室介绍（中英对照） */
  document.getElementById("sec-intro-head").innerHTML =
    U.secHead("实验室介绍", "INTRODUCTION", "", "purple");
  var zhParas = (S.introZh || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
  var enParas = (S.introEn || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
  document.getElementById("intro-cols").innerHTML =
    '<div class="col-zh">' + (zhParas || U.placeholder("介绍待补充")) + "</div>" +
    '<div class="col-en en">' + enParas + "</div>";
  document.getElementById("intro-figure").innerHTML =
    U.img("assets/img/handbook/page-05.jpg", "实验室架构循环示意图") +
    "<figcaption>实验室架构循环示意图（转录自项目手册）</figcaption>";

  /* 理念 */
  document.getElementById("sec-philosophy-head").innerHTML =
    U.secHead("理念", "PHILOSOPHY", "", "purple");
  document.getElementById("philosophy-block").innerHTML =
    '<div class="notice"><strong>' + S.philosophyZh + "</strong>" +
    '<div class="en" style="margin-top:var(--sp-2);color:var(--gray)">' + S.philosophyEn + "</div></div>";

  /* 四大方向速览 */
  document.getElementById("sec-directions-head").innerHTML =
    U.secHead("四大方向", "DIRECTIONS", "", "purple");
  document.getElementById("directions-grid").innerHTML = S.directions.map(function (d) {
    return '<a class="card dir-card" href="research.html#' + d.key + '">' +
      '<div class="thumb"><span class="num">' + d.num + "</span>" + U.img(d.image, d.zh) + "</div>" +
      '<div class="body"><div class="title">' + d.zh + "</div>" +
      '<div class="title-en">' + d.en + "</div>" +
      '<div class="under" style="background:' + d.color + '"></div></div></a>';
  }).join("");

  /* 联系方式 */
  document.getElementById("sec-contact-head").innerHTML =
    U.secHead("联系方式", "CONTACT", "", "purple");
  var c = S.contact || {};
  document.getElementById("contact-block").innerHTML =
    '<div class="meta-table">' +
      '<div><div class="k">邮箱 Email</div><div class="v">' +
        (c.email ? '<a href="mailto:' + c.email + '" style="border-bottom:1px solid var(--ink)">' + c.email + "</a>"
                 : '<span style="color:var(--gray-2)">待补充</span>') + "</div></div>" +
      '<div><div class="k">微信公众号 WeChat</div><div class="v">' +
        (c.wechat ? c.wechat : '<span style="color:var(--gray-2)">待补充</span>') + "</div></div>" +
      '<div><div class="k">地址 Address</div><div class="v">' + (c.addressZh || "") +
        '<div class="en" style="font-weight:400;color:var(--gray);font-size:var(--fs-tiny)">' + (c.addressEn || "") + "</div></div></div>" +
    "</div>";
})();
</script>
</body>
</html>
